    --text: #f1f5f9;
    --text-secondary: #94a3b8;
    --border: #334155;
    --accent: #6366f1;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --accent: #4f46e5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main {
    width: 100%;
    max-width: 640px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .subtitle { margin: 0 0 28px; color: var(--text-secondary); }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  a:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.08); }
  a .label { font-weight: 600; }
  a .desc { color: var(--text-secondary); font-size: 13px; }
</style>
