name: Test and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip freeze > dependency-lock.txt

      - name: Syntax check - core modules
        shell: bash
        run: |
          echo "Checking syntax for core modules..."
          python -m py_compile config.py
          python -m py_compile toolbox.py
          python -m py_compile main.py
          python -m py_compile build.py
          echo "OK: Core modules syntax check passed"

      - name: Syntax check - common modules
        shell: bash
        run: |
          echo "Checking syntax for common modules..."
          for file in common/*.py; do
            [ -f "$file" ] && python -m py_compile "$file"
          done
          echo "OK: Common modules syntax check passed"

      - name: Syntax check - plugin modules
        shell: bash
        run: |
          echo "Checking syntax for plugin modules..."
          for file in plugins/*.py; do
            [ -f "$file" ] && python -m py_compile "$file"
          done
          echo "OK: Plugin modules syntax check passed"

      - name: Syntax check - test files
        shell: bash
        run: |
          echo "Checking syntax for test files..."
          for file in test/*.py; do
            [ -f "$file" ] && python -m py_compile "$file"
          done
          echo "OK: Test files syntax check passed"

      - name: Run tests
        shell: bash
        run: |
          # 已知问题：全部测试通过后，解释器退出阶段 Qt/pytest-qt 在 CI
          # 虚拟显示下清理 QApplication 会段错误（退出码 139）。仅当
          # pytest 输出含 "passed" 且退出码为 139 时视为通过；真正的
          # 测试失败退出码为 1/2，不受影响。
          set +e
          output=$(python -m pytest test/ -x -q --ignore=test/test_adaptive_ui.py --ignore=test/test_icon.py --ignore=test/test_icon_scaling.py 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 139 ] && echo "$output" | grep -qE "[0-9]+ passed"; then
            echo "Teardown segfault after tests passed — treated as success"
            exit 0
          fi
          exit "$code"
        env:
          QT_QPA_PLATFORM: "offscreen"

      - name: Lint
        shell: bash
        run: |
          python -m ruff check --select E9,F63,F7,F82 plugins/ common/ toolbox.py main.py config.py

      - name: Verify main.py import
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import main; print('Verification passed')"

      - name: Run build.py to verify executable generation
        shell: bash
        timeout-minutes: 10
        run: |
          echo "Running build.py to verify packaging..."
          python build.py
          echo "OK: build.py completed successfully"

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: toolbox-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.docx
            dependency-lock.txt
          retention-days: 30
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Syntax check - core modules
        run: |
          echo "Checking syntax for core modules..."
          python -m py_compile config.py
          python -m py_compile toolbox.py
          python -m py_compile main.py
          python -m py_compile build.py
          echo "OK: Core modules syntax check passed"

      - name: Syntax check - common modules
        run: |
          echo "Checking syntax for common modules..."
          for file in common/*.py; do
            [ -f "$file" ] && python -m py_compile "$file"
          done
          echo "OK: Common modules syntax check passed"

      - name: Syntax check - plugin modules
        run: |
          echo "Checking syntax for plugin modules..."
          for file in plugins/*.py; do
            [ -f "$file" ] && python -m py_compile "$file"
          done
          echo "OK: Plugin modules syntax check passed"

      - name: Syntax check - test files
        run: |
          echo "Checking syntax for test files..."
          for file in test/*.py; do
            [ -f "$file" ] && python -m py_compile "$file"
          done
          echo "OK: Test files syntax check passed"

      - name: Run tests
        run: |
          # 同 Windows 节：测试全过后 Qt 清理段错误（139）视为通过
          set +e
          output=$(python -m pytest test/ -x -q --ignore=test/test_adaptive_ui.py --ignore=test/test_icon.py --ignore=test/test_icon_scaling.py 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 139 ] && echo "$output" | grep -qE "[0-9]+ passed"; then
            echo "Teardown segfault after tests passed — treated as success"
            exit 0
          fi
          exit "$code"
        env:
          QT_QPA_PLATFORM: "offscreen"

      - name: Lint
        run: |
          python -m ruff check --select E9,F63,F7,F82 plugins/ common/ toolbox.py main.py config.py

      - name: Verify main.py import
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import main; print('Verification passed')"

      - name: Run build_macos.py to verify app bundle generation
        timeout-minutes: 15
        run: |
          echo "Running build_macos.py to verify packaging..."
          python build_macos.py
          echo "OK: build_macos.py completed successfully"

      - name: Report bundle size breakdown
        run: |
          APP_FILE=$(find dist -name "*.app" -type d | head -1)
          echo "== .app total (real bytes) =="
          find "$APP_FILE" -type f -exec stat -f%z {} + | awk '{s+=$1} END {printf "%.1f MB\n", s/1048576}'
          echo "== top 25 largest files (real bytes) =="
          find "$APP_FILE" -type f -exec stat -f "%z %N" {} + | sort -rn | head -25 | awk '{printf "%6.1f MB  %s\n", $1/1048576, $2}'

      - name: Build .dmg
        run: |
          VERSION=$(python -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('config.py', encoding='utf-8').read()).group(1))")
          DMG_NAME="工具箱ToolBox-v${VERSION}.dmg"
          # 输出不能放在 srcfolder 内，否则 dmg 会把正在写入的自身递归打包导致体积翻倍
          hdiutil create -volname "工具箱ToolBox-v${VERSION}" \
            -srcfolder dist -ov -format UDZO "../${DMG_NAME}"
          mv "../${DMG_NAME}" "dist/${DMG_NAME}"
          if [ ! -f "dist/${DMG_NAME}" ]; then
            echo "ERROR: .dmg was not created!"
            exit 1
          fi
          echo "DMG: ${DMG_NAME}"

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: toolbox-macos-${{ github.sha }}
          path: |
            dist/*.dmg
          retention-days: 30
          if-no-files-found: error
